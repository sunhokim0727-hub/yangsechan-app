name: Android APK 빌드

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # 깃허브 빌드 번호(push할 때마다 1씩 증가)를 versionCode로 사용 -> 플레이스토어 업데이트 시 항상 이전보다 큰 값 보장
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: 코드 받아오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 라이선스 동의 (러너에 이미 설치되어 있음)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 필요한 SDK 패키지 설치
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 패키지 설치
        run: npm install

      - name: 웹 코드 → 안드로이드 프로젝트 동기화
        run: npx cap sync android

      - name: gradlew 실행권한 부여
        run: chmod +x android/gradlew

      - name: 디버그 APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 디버그 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- 아래부터는 릴리즈 서명 키가 GitHub Secrets에 등록되어 있을 때만 실행됨 ----
      - name: 서명 키 복원 (secrets에 등록된 경우에만)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 릴리즈 AAB 빌드 (스토어 업로드용)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 릴리즈 APK 빌드 (직접 설치 테스트용)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 릴리즈 AAB 업로드
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: 릴리즈 APK 업로드
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
