<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEAFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>이마 제시어 게임</title>
<style>
:root{
  --ink:#1D1642; --sub:#6b6790; --bg:#EEEAFF;
  --violet:#6A4DFF; --pink:#FF5C93; --lemon:#FFD23F; --mint:#2DD4A7; --sky:#57B8FF;
  --line:#1D1642;
  --font-d:"Black Han Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font-b:"Noto Sans KR","Pretendard","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
  --outline:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{word-break:keep-all;overflow-wrap:break-word;margin:0;color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(rgba(106,77,255,.16) 1.6px,transparent 1.7px);background-size:22px 22px}
#app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}

/* ---------- 글자 ---------- */
h1,h2{font-family:var(--font-d);font-weight:400;margin:0}
h1{font-size:34px;line-height:1.1;letter-spacing:-.5px}
h2{font-size:22px;margin-bottom:12px;letter-spacing:-.3px}
p{margin:0 0 8px}
.sub{color:var(--sub);font-size:14px}
.title{color:var(--lemon);font-size:clamp(46px,15.5vw,68px);line-height:1.02;letter-spacing:-1px;text-shadow:var(--outline),0 8px 0 var(--ink)}
.title.sm{font-size:34px;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 5px 0 var(--ink)}

/* ---------- 첫 화면 ---------- */
.hero{position:relative;padding:14px 0 6px;margin-bottom:10px}
.hero .tag{margin:16px 0 0;font-weight:800;max-width:62%;color:var(--ink)}
.hero-card{position:absolute;right:2px;top:8px;width:98px;height:128px;background:var(--pink);border:3px solid var(--ink);border-radius:20px;
  transform:rotate(9deg);display:grid;place-items:center;font-family:var(--font-d);font-size:72px;color:#fff;box-shadow:5px 7px 0 var(--ink);text-shadow:var(--outline)}
.me-chip{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:10px 12px;margin-bottom:14px;box-shadow:0 5px 0 var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.tile{font:inherit;font-family:var(--font-d);font-size:24px;border:3px solid var(--ink);border-radius:24px;padding:18px 8px 16px;cursor:pointer;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.tile{transition:transform .06s,box-shadow .06s}
.tile:active{transform:translateY(7px) scale(.98);box-shadow:0 0 0 var(--ink)}
.tile .ti{font-size:38px;line-height:1}
.tile.t-create{background:var(--violet);color:#fff}
.tile.t-join{background:var(--lemon)}

/* ---------- 카드/버튼/입력 ---------- */
.card{background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:16px;margin:0 0 16px;box-shadow:0 6px 0 var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row>.btn{flex:none}
.row>.btn.grow{flex:1 1 0;min-width:max-content}
.row>input{flex:1 1 0;min-width:0;width:auto}
.grow{flex:1;min-width:0}
.gap{height:12px}
.btn{white-space:nowrap;font:inherit;font-weight:900;border:2.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:16px;padding:13px 18px;
  box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--violet);color:#fff}
.btn.lemon{background:var(--lemon)}
.btn.danger{background:var(--pink);color:#fff}
.btn.mint{background:var(--mint)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.small:active{transform:translateY(3px) scale(.97)}
.btn.block{display:block;width:100%}
.btn.huge{padding:18px;font-size:22px;border-radius:20px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
input,select{font:inherit;font-size:16px;width:100%;border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;background:#fff;color:var(--ink)}
input::placeholder{color:#a9a5c8}
input.code{font-family:var(--font-d);font-size:32px;letter-spacing:8px;text-align:center;text-transform:uppercase;padding:14px 8px 14px 16px}
label.f{display:block;font-weight:900;margin:14px 0 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:58px;font:inherit;font-weight:800;border:2.5px solid var(--ink);background:#fff;border-radius:14px;padding:10px 6px;white-space:nowrap;cursor:pointer;color:var(--ink);transition:transform .14s cubic-bezier(.22,.9,.32,1.3),box-shadow .14s}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.badge{display:inline-block;font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;background:#fff;white-space:nowrap;line-height:1.5}
.badge.v{background:var(--violet);color:#fff}
.badge.l{background:var(--lemon)}
.badge.m{background:var(--mint)}
.badge.p{background:var(--pink);color:#fff}
.badge.g{background:#e6e4f2;color:var(--sub);border-color:#b9b7cf}
.avatar{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);font-size:24px;line-height:1;flex:none}
.empty{color:var(--sub);text-align:center;padding:16px 0}

/* ---------- 방 코드/멤버/채팅 ---------- */
.codebox{font-family:var(--font-d);font-size:46px;letter-spacing:10px;text-align:center;background:var(--lemon);border:3px dashed var(--ink);border-radius:20px;padding:8px 0 6px 10px;line-height:1.3}
.player{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:2px dashed #d9d5f2}
.player:first-of-type{border-top:0}
.pub{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:2px dashed #d9d5f2}
.pub:first-of-type{border-top:0}
.chat{height:220px;overflow-y:auto;border:2.5px solid var(--ink);border-radius:18px;padding:10px;background:#F6F4FF}
.msg{margin:0 0 9px;word-break:break-word}
.msg b{font-size:12.5px;color:var(--sub);font-weight:800}
.msg .t{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:5px 16px 16px 16px;padding:6px 12px;max-width:88%;text-align:left}
.msg.me{text-align:right}
.msg.me .t{background:var(--lemon);border-radius:16px 5px 16px 16px}
.msg.sys{text-align:center;color:var(--sub);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-weight:800;z-index:50;max-width:90%;text-align:center;box-shadow:0 5px 0 rgba(29,22,66,.3)}
.modal{position:fixed;inset:0;background:rgba(29,22,66,.62);display:grid;place-items:center;z-index:40;padding:20px}
.modal .box{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:20px;text-align:center;box-shadow:0 8px 0 var(--ink)}
#qr{display:inline-block;padding:10px;background:#fff}
.center{text-align:center}

/* ---------- 게임 화면(같은 공간) : 가로 전체화면 ---------- */
.stage{min-height:70vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px;border:3px solid var(--ink);border-radius:28px;padding:22px;box-shadow:0 8px 0 var(--ink);margin-bottom:14px}
.stage.cd{background:radial-gradient(circle at 50% 42%,#8f79ff 0%,var(--violet) 52%,#4a32d8 100%);color:#fff}
.stage.wd{background:repeating-linear-gradient(135deg,#FFE27A 0 24px,#FFD23F 24px 48px)}
.stage .count{font-family:var(--font-d);font-size:min(38vmin,180px);line-height:1;text-shadow:var(--outline),0 8px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.stage .msg{font-family:var(--font-d);font-size:24px;line-height:1.3}
.stage .cat{align-self:center;background:var(--ink);color:#fff;border-radius:999px;padding:4px 18px;font-weight:800}
.stage .word{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font-d);font-weight:400;line-height:1.2;color:var(--ink)}
.stage .word span{display:inline-block;max-width:100%;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:.12em .4em;box-shadow:0 6px 0 var(--ink);word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.rot{position:fixed;inset:0;z-index:30;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.rot .stage{flex:1;min-height:0;margin:0;padding:14px;gap:8px;overflow:hidden}
.rot .stage .msg{font-size:min(6vmin,24px)}
.rot .stage .count{font-size:min(30vmin,150px)}
@media (orientation:portrait){
  .rot{inset:auto;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:top left}
  html[data-home="right"] .rot{transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
  html[data-home="left"] .rot{transform:translateY(100vh) rotate(-90deg);transform:translateY(100dvh) rotate(-90deg)}
}

/* ---------- 온라인 게임 화면 ---------- */
html[data-role="ask"],html[data-role="ask"] body{background:#FFE27A}
html[data-role="answer"],html[data-role="answer"] body{background:#A8F0DC}
html[data-role="wait"],html[data-role="wait"] body{background:#DCDCE8}
html[data-role="watch"],html[data-role="watch"] body{background:#D6ECFF}
.banner{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;font-weight:900;margin:2px 0 12px;box-shadow:0 5px 0 var(--ink)}
.timerbar{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.tlabel{font-weight:900;font-size:13px;white-space:nowrap}
.tbar{flex:1;height:16px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--mint);transition:width .25s linear}
.tbar i.low{background:var(--pink)}
.tnum{font-family:var(--font-d);font-size:20px;min-width:66px;text-align:right}
.strip{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 12px}
.pc{position:relative;flex:none;min-width:108px;max-width:150px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 8px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.pc.q{background:var(--lemon)}
.pc.gone{opacity:.5}
/* 내 카드: 항상 맨 왼쪽에 고정(옆으로 넘겨도 안 사라짐) + 보라색으로 확실히 구분 */
.pc.me{position:sticky;left:2px;z-index:3;background:var(--violet);color:#fff;border-width:3px;margin-right:6px;box-shadow:0 4px 0 var(--ink),9px 0 10px -6px rgba(29,22,66,.5)}
.pc.me .nm{color:#fff}
.pc.me .wr{color:var(--lemon)}
.pc.me .stt{color:#fff}
.pc.me .wd{background:#fff;color:var(--ink)}
.pc .ribbon{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--lemon);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 14px;font-family:var(--font-d);font-size:13px;line-height:1.55;white-space:nowrap}
.pc .nm{font-weight:900;font-size:14px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .wd{display:inline-block;background:#F1EEFF;border:2px solid var(--ink);border-radius:10px;padding:1px 8px;font-weight:900;margin:6px 0 4px;word-break:keep-all;overflow-wrap:anywhere;font-size:14px}
.pc .wr{font-size:12px;font-weight:800;color:var(--pink)}
.pc .stt{font-size:12px;font-weight:800;color:var(--sub)}
.chat.g{height:34vh;min-height:180px}

/* ---------- 결과 화면 ---------- */
.rank{font-family:var(--font-d);font-size:20px;min-width:74px}
.rank.last{color:var(--pink)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:14px 0 20px;border-bottom:3px solid var(--ink)}
.pod{flex:1;max-width:116px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pod.none{visibility:hidden}
.pod .avatar{width:58px;height:58px;font-size:32px}
.pod .pn{font-weight:900;font-size:14px;word-break:keep-all;margin-top:4px}
.pod .pw{font-size:12px;color:var(--sub);min-height:1.3em;word-break:keep-all}
.pod .bar{width:100%;border:2.5px solid var(--ink);border-bottom:0;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:6px;font-size:30px;margin-top:6px}
.p1 .bar{height:126px;background:var(--lemon);animation:barGrow .5s .1s cubic-bezier(.22,.9,.32,1.15) both}
.p2 .bar{height:92px;background:#DDE5FF;animation:barGrow .5s .22s cubic-bezier(.22,.9,.32,1.15) both}
.p3 .bar{height:66px;background:#FFD9B8;animation:barGrow .5s .34s cubic-bezier(.22,.9,.32,1.15) both}
@keyframes barGrow{0%{transform:scaleY(0);opacity:0}100%{transform:scaleY(1);opacity:1}}
.pod .bar{transform-origin:bottom}
@media (prefers-reduced-motion:reduce){.p1 .bar,.p2 .bar,.p3 .bar{animation:none}}
.player.loser{background:#FFF0F5;border:2px dashed var(--pink);border-radius:16px;padding:10px 12px;margin-top:10px}
.mecard{display:flex;align-items:center;gap:14px;background:var(--violet);color:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 16px;margin:0 0 16px;box-shadow:0 6px 0 var(--ink)}
.mecard .avatar{width:64px;height:64px;font-size:36px}
.mecard .mr{font-family:var(--font-d);font-size:36px;line-height:1.1;color:var(--lemon)}
.mecard .sub{color:#E3DBFF}
.player.me{background:var(--violet);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;margin:6px 0;box-shadow:0 4px 0 var(--ink)}
.player.me .sub{color:#E3DBFF}
.player.me .rank{color:var(--lemon)}
.pod.me .avatar{box-shadow:0 0 0 4px var(--violet),0 0 0 7px var(--ink)}
.pod.me .pn{color:var(--violet)}
.confetti{position:fixed;top:-16px;width:10px;height:15px;z-index:60;pointer-events:none;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}
.newmem{background:#E3F4FF;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;margin:0 0 14px;box-shadow:0 4px 0 var(--ink);font-weight:800}
.newmem .sub{font-weight:500;margin-top:4px}
.avpick{margin:6px 0 4px}
.avprev{display:flex;justify-content:center;margin:2px 0 14px}
.avprev .avatar{width:96px;height:96px;font-size:56px;border-width:3px;box-shadow:0 5px 0 var(--ink)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:224px;overflow-y:auto;padding:8px;border:2.5px solid var(--ink);border-radius:18px;background:#F6F4FF}
.avgrid button{aspect-ratio:1;font-size:26px;line-height:1;border:2.5px solid transparent;border-radius:14px;background:#fff;cursor:pointer;padding:0;font-family:inherit}
.avgrid button.on{border-color:var(--ink);background:var(--lemon);box-shadow:0 3px 0 var(--ink)}
.avcolors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;justify-items:center;margin:14px 4px 0}
.avcolors button{width:100%;max-width:34px;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;padding:0}
.avcolors button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
@keyframes pop{0%{transform:scale(1.7);opacity:0}100%{transform:scale(1);opacity:1}}
/* ---------- 화면 전환 / 모달 / 토스트 애니메이션 ---------- */
@keyframes viewIn{0%{opacity:0;transform:translateY(16px) scale(.985)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{0%{opacity:0;transform:scale(.88) translateY(12px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,14px) scale(.96)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes tileInStagger{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
#viewWrap{animation:none}
#viewWrap.enter{animation:viewIn .32s cubic-bezier(.22,.9,.32,1.15) both}
.modal{animation:fadeIn .18s ease both}
.modal .box{animation:modalIn .26s cubic-bezier(.22,.9,.32,1.15) both}
.toast{animation:toastIn .28s cubic-bezier(.22,.9,.32,1.15) both}
#viewWrap.enter .tiles .tile{animation:tileInStagger .34s cubic-bezier(.22,.9,.32,1.15) both}
#viewWrap.enter .tiles .tile:nth-child(2){animation-delay:.05s}
.scan video{animation:fadeIn .25s ease both}
/* ---------- 부팅/로딩 화면 ---------- */
.boot{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.boot-card{width:108px;height:138px;background:var(--pink);border:3px solid var(--ink);border-radius:22px;display:grid;place-items:center;font-size:62px;
  box-shadow:6px 8px 0 var(--ink);animation:bootFloat 1.6s ease-in-out infinite}
@keyframes bootFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.boot-dots{display:flex;gap:8px}
.boot-dots i{width:11px;height:11px;border-radius:50%;background:var(--violet);border:2px solid var(--ink);animation:bootDot 1s ease-in-out infinite}
.boot-dots i:nth-child(2){animation-delay:.15s;background:var(--lemon)}
.boot-dots i:nth-child(3){animation-delay:.3s;background:var(--mint)}
@keyframes bootDot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-7px);opacity:1}}
@media (prefers-reduced-motion:reduce){.boot-card,.boot-dots i{animation:none}}
.or{display:flex;align-items:center;gap:10px;color:var(--sub);font-weight:800;font-size:13px;margin:18px 0 0}
.or::before,.or::after{content:'';flex:1;border-top:2px dashed #cfc9ee}
.scan{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;overflow:hidden;
  padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.scan-frame{position:absolute;left:50%;top:42%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid var(--lemon);border-radius:26px;box-shadow:0 0 0 100vmax rgba(0,0,0,.58);z-index:1}
.scan-msg{position:relative;z-index:2;color:#fff;font-weight:800;text-align:center;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:999px}
.scan .btn{position:relative;z-index:2;width:100%;max-width:320px}
.help-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:900;color:var(--ink);background:rgba(255,255,255,.72);border:2.5px dashed var(--ink);border-radius:18px;padding:12px;margin:-8px 0 22px;cursor:pointer}
.help-btn:active{background:#fff}
.help-btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.modal .box.help{text-align:left;width:100%;max-width:440px;max-height:86vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
.help .hb{overflow-y:auto;padding:18px 18px 6px}
.help .hf{padding:10px 18px 18px;border-top:2px dashed #d9d5f2}
.help h2{margin-bottom:8px}
.help h3{font-family:var(--font-d);font-weight:400;font-size:18px;margin:16px 0 6px}
.help ol{margin:0;padding-left:22px}
.help li{margin-bottom:5px}
.help .goal{background:var(--lemon);border:2.5px solid var(--ink);border-radius:14px;padding:9px 12px;font-weight:800}

function pickWords(category, n) {
  const pool = (category && category !== RANDOM_CATEGORY && WORDS[category])
    ? WORDS[category].slice() : [...new Set(Object.values(WORDS).flat())];
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, n);
}

/* =====================================================================
   2. 서버 통신 (Firebase 전용)  - 화면 코드는 이 Api만 호출합니다
   ===================================================================== */
const Api = {
  db: null, auth: null, _pres: null, offset: 0,
  now() { return Date.now() + this.offset; },
  R(p) { return this.db.ref(p); },
  TS: () => firebase.database.ServerValue.TIMESTAMP,

  async init() {
    firebase.initializeApp(FIREBASE_CONFIG);
    this.auth = firebase.auth();
    this.db = firebase.database();
    this.db.ref('.info/serverTimeOffset').on('value', s => { this.offset = s.val() || 0; });
    let user = await new Promise(res => { const un = this.auth.onAuthStateChanged(u => { un(); res(u); }); });
    if (!user) user = (await this.auth.signInAnonymously()).user; // 게스트 로그인
    return user.uid;
  },

  /* 프로필 */
  async getProfile(uid) { return (await this.R(`users/${uid}`).once('value')).val(); },
  async saveProfile(uid, nickname, avatar) { await this.R(`users/${uid}`).update({ nickname, avatar: avatar || null }); },

  /* 방 만들기 / 들어가기 / 나가기 */
  async createRoom(uid, nickname, o) {
    let code = null;
    for (let i = 0; i < 8 && !code; i++) {
      const c = genCode();
      if (!(await this.R(`rooms/${c}/meta`).once('value')).exists()) code = c;
    }
    if (!code) throw new Error('방 코드를 만들지 못했어요. 다시 시도해 주세요.');
    const meta = {
      hostId: uid, hostName: nickname, mode: o.mode, visibility: o.visibility,
      chatMode: o.chatMode, chatLimit: o.chatLimit, maxPlayers: o.maxPlayers,
      category: o.category, status: 'lobby', createdAt: this.TS(), lastSeen: this.TS(), lastActivity: this.TS()
    };
    await this.R(`rooms/${code}/meta`).set(meta);
    await this.R(`rooms/${code}/players/${uid}`).set(newPlayer(nickname));
    if (o.visibility === 'public') {
      await this.R(`publicRooms/${code}`).set({
        hostName: nickname, category: o.category, chatMode: o.chatMode, mode: o.mode,
        status: 'lobby', playerCount: 1, maxPlayers: o.maxPlayers, createdAt: this.TS(), lastSeen: this.TS(), lastActivity: this.TS()
      });
    }
    return code;
  },

  async joinRoom(rawCode, uid, nickname) {
    const code = String(rawCode || '').trim().toUpperCase();
    if (code.length !== CODE_LEN) throw new Error(`방 코드는 ${CODE_LEN}자리예요.`);
    const meta = (await this.R(`rooms/${code}/meta`).once('value')).val();
    if (!meta) throw new Error('없는 방이에요. 코드를 다시 확인해 주세요.');
    if (meta.lastSeen) { // 오래 비어 있던 방: 서버 규칙이 '오래됐다'고 확인해 줘서 실제로 지워졌을 때만 없어진 방으로 처리
      const n = this.now();
      if (n - meta.lastSeen > ROOM_OFFLINE_MS || n - (meta.lastActivity || meta.lastSeen) > ROOM_IDLE_MS) {
        if (await this.deleteRoomIfStale(code)) throw new Error('오랫동안 사용하지 않아 사라진 방이에요.');
      }
    }
    if ((await this.R(`rooms/${code}/kicked/${uid}`).once('value')).exists()) throw new Error('이 방에서 강퇴되어 들어갈 수 없어요.');
    const players = (await this.R(`rooms/${code}/players`).once('value')).val() || {};
    if (!players[uid]) {
      if (meta.status !== 'lobby' && meta.mode !== 'online') throw new Error('같은 공간 모드는 게임이 시작되면 들어갈 수 없어요.');
      if (Object.keys(players).length >= meta.maxPlayers) throw new Error('방이 가득 찼어요.');
      this.lastJoinSpectator = meta.status !== 'lobby'; // 게임 중에 들어오면 관전자
      await this.R(`rooms/${code}/players/${uid}`).set(newPlayer(nickname));
      if (meta.visibility === 'public') this.bumpCount(code, +1);
    } else if (players[uid].nickname !== nickname || JSON.stringify(players[uid].avatar || null) !== JSON.stringify(S.avatar || null)) {
      await this.R(`rooms/${code}/players/${uid}`).update({ nickname, avatar: S.avatar || null });
    }
    return code;
  },

  bumpCount(code, d) {
    return this.R(`publicRooms/${code}/playerCount`)
      .transaction(n => (n === null ? null : Math.max(0, (n || 0) + d))).catch(() => {});
  },

  async leaveRoom(code, uid) {
    this.detachPresence(code, uid);
    const [pS, mS] = await Promise.all([this.R(`rooms/${code}/players`).once('value'), this.R(`rooms/${code}/meta`).once('value')]);
    const meta = mS.val(); if (!meta) return;
    const players = pS.val() || {};
    const others = Object.entries(players).filter(([id]) => id !== uid)
      .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
    if (others.length === 0) { // 마지막 사람이 나가면 방 삭제
      await this.db.ref().update({
        [`rooms/${code}/meta`]: null, [`rooms/${code}/players/${uid}`]: null, [`rooms/${code}/chat`]: null,
        [`rooms/${code}/kicked`]: null, [`rooms/${code}/muted`]: null, [`rooms/${code}/game`]: null, [`rooms/${code}/words`]: null, [`rooms/${code}/wordHashes`]: null, [`rooms/${code}/reports`]: null, [`publicRooms/${code}`]: null
      });
      return;
    }
    if (meta.hostId === uid) { // 방장이 나가면 다음 사람에게 방장 넘김
      const [nid, np] = others[0];
      if (meta.visibility === 'public') await this.R(`publicRooms/${code}/hostName`).set(np.nickname).catch(() => {});
      await this.R(`rooms/${code}/meta`).update({ hostId: nid, hostName: np.nickname });
    }
    await this.R(`rooms/${code}/players/${uid}`).remove();
    if (meta.visibility === 'public') this.bumpCount(code, -1);
  },

  /* 접속 상태 표시 (끊기면 '오프라인'으로만 표시하고 방에는 남겨둠) */
  attachPresence(code, uid) {
    this.detachPresence(code, uid);
    const ref = this.R(`rooms/${code}/players/${uid}/online`);
    const con = this.R('.info/connected');
    const fn = con.on('value', s => { if (s.val() === true) { ref.onDisconnect().set(false).catch(() => {}); ref.set(true).catch(() => {}); } });
    this._pres = { con, fn, ref };
  },
  detachPresence() {
    if (!this._pres) return;
    this._pres.con.off('value', this._pres.fn);
    this._pres.ref.onDisconnect().cancel().catch(() => {});
    this._pres = null;
  },

  /* 방 실시간 구독 */
  watchRoom(code, uid, cb) {
    const subs = ['meta', 'players', 'muted', 'kicked', 'game', 'wordHashes', 'reports'].map(k => {
      const ref = this.R(`rooms/${code}/${k}`);
      const fn = ref.on('value', s => cb(k, s.val()), () => {});
      return () => ref.off('value', fn);
    });
    const cref = this.R(`rooms/${code}/chat`).limitToLast(300);
    const cfn = cref.on('value', s => {
      const arr = []; s.forEach(ch => { arr.push({ id: ch.key, ...ch.val() }); });
      cb('chat', arr);
    }, () => {});
    subs.push(() => cref.off('value', cfn));
    const wref = this.R(`rooms/${code}/words/${uid}`); // 내 제시어(내 것만 읽을 수 있음)
    const wfn = wref.on('value', s => cb('word', s.val()), () => {});
    subs.push(() => wref.off('value', wfn));
    return () => subs.forEach(f => f());
  },

  watchPublic(cb) {
    const ref = this.R('publicRooms').orderByChild('createdAt').limitToLast(30);
    const fn = ref.on('value', s => {
      const arr = []; s.forEach(ch => { arr.push({ code: ch.key, ...ch.val() }); });
      cb(arr.reverse());
    }, () => cb([]));
    return () => ref.off('value', fn);
  },

  /* 대기실 동작 */
  setReady(code, uid, v) { return this.R(`rooms/${code}/players/${uid}/ready`).set(!!v); },
  setWish(code, uid, v) { return this.R(`rooms/${code}/players/${uid}/wish`).set(v || ''); },
  async setCategory(code, cat, isPublic) {
    await this.R(`rooms/${code}/meta/category`).set(cat);
    if (isPublic) await this.R(`publicRooms/${code}/category`).set(cat).catch(() => {});
  },
  async kick(code, target, isPublic) {
    await this.R(`rooms/${code}/kicked/${target}`).set(true);
    await this.R(`rooms/${code}/players/${target}`).remove();
    if (isPublic) this.bumpCount(code, -1);
  },
  setMuted(code, target, on) {
    const r = this.R(`rooms/${code}/muted/${target}`);
    return on ? r.set(true) : r.remove();
  },
  sendChat(code, uid, nickname, text, extra) {
    return this.R(`rooms/${code}/chat`).push({ uid, nickname, text, ts: this.TS(), ...(extra || {}) });
  },
  report(code, msgId, uid) { return this.R(`rooms/${code}/reports/${msgId}/${uid}`).set(true); },
  /* ---- 부적절한 이용자 신고 (게임 경고와 무관, 운영자 검토용) ---- */
  reportAbuse({ reporterUid, targetUid, targetNickname, roomCode, text, reason }) {
    return this.R('abuseReports').push({
      reporterUid, targetUid, targetNickname: (targetNickname || '').slice(0, 20),
      roomCode: roomCode || '', text: (text || '').slice(0, 200), reason: (reason || '기타').slice(0, 30), ts: this.TS()
    });
  },
  deleteProfile(uid) { return this.R(`users/${uid}`).remove(); },
  /* 게임 시작 / 다시 하기 (방장) : 제시어를 사람마다 하나씩 배정 */
  async startGame(code, meta, players) {
    const ids = Object.keys(players);
    const words = pickWords(meta.category, ids.length);
    const online = meta.mode === 'online';
    const game = { startedAt: this.TS(), ended: false };
    game.players = Object.fromEntries(ids.map(id => [id, true])); // 이번 판 참가자 (나중에 들어온 사람은 관전자)
    const up = { [`rooms/${code}/meta/status`]: 'playing' };
    ids.forEach((id, i) => { up[`rooms/${code}/words/${id}`] = words[i]; });
    if (online) {
      // 온라인: 질문 순서 정하기 + 정답 확인용 해시 저장 + 지난 채팅/경고 지우기
      const order = shuffle(ids);
      game.order = order;
      if (meta.chatMode === 'normal') game.turn = { n: 0, qid: order[0], phase: 'ask', at: this.TS() };
      up[`rooms/${code}/chat`] = null; up[`rooms/${code}/reports`] = null;
      for (let i = 0; i < ids.length; i++) up[`rooms/${code}/wordHashes/${ids[i]}`] = await wordHash(code, ids[i], words[i]);
    }
    up[`rooms/${code}/game`] = game;
    if (meta.visibility === 'public') up[`publicRooms/${code}/status`] = 'playing';
    await this.db.ref().update(up);
  },
  pressCorrect(code, uid, word, nickname) { return this.R(`rooms/${code}/game/results/${uid}`).set({ at: this.TS(), word: word || '', nickname: nickname || '' }); },
  /* 오래된 방 정리: 서버 규칙이 (서버 시계 기준으로) 오래됐다고 인정할 때만 지워짐 */
  async deleteRoomIfStale(code) {
    try { await this.db.ref().update({ [`rooms/${code}`]: null, [`publicRooms/${code}`]: null }); return true; }
    catch (e) { return false; }
  },
  async cleanPublicEntry(code) { // 공개방 목록에서 오래된 방/사라진 방 항목 정리
    const m = await this.R(`rooms/${code}/meta`).once('value');
    if (!m.exists()) { await this.R(`publicRooms/${code}`).remove().catch(() => {}); return; }
    await this.deleteRoomIfStale(code);
  },
  async transferHost(code, uid, nickname, isPublic) {
    await this.db.ref().update({ [`rooms/${code}/meta/hostId`]: uid, [`rooms/${code}/meta/hostName`]: nickname });
    if (isPublic) await this.R(`publicRooms/${code}/hostName`).set(nickname).catch(() => {});
  },
  markLeft(code, uid, nickname) { return this.R(`rooms/${code}/game/left/${uid}`).set({ nickname: nickname || '', at: this.TS() }); },
  endGame(code) { return this.R(`rooms/${code}/game/ended`).set(true); },
  async setStatus(code, status, isPublic, playerIds) {
    const up = { [`rooms/${code}/meta/status`]: status };
    if (isPublic) up[`publicRooms/${code}/status`] = status;
    if (status === 'lobby') {
      (playerIds || []).forEach(id => { up[`rooms/${code}/players/${id}/ready`] = false; });
      up[`rooms/${code}/game`] = null; up[`rooms/${code}/words`] = null;
      up[`rooms/${code}/chat`] = null; up[`rooms/${code}/reports`] = null; up[`rooms/${code}/wordHashes`] = null;
    }
    await this.db.ref().update(up);
  }
};

function categoryOptions(selected, withRandom, emptyLabel) {
  let h = '';
  if (withRandom) h += `<option value="${RANDOM_CATEGORY}" ${selected === RANDOM_CATEGORY ? 'selected' : ''}>랜덤(전체)</option>`;
  if (emptyLabel) h += `<option value="" ${!selected ? 'selected' : ''}>${emptyLabel}</option>`;
  CATEGORY_GROUPS.forEach(g => {
    h += `<optgroup label="${g.group}">` + g.items.map(i => `<option ${i === selected ? 'selected' : ''}>${i}</option>`).join('') + '</optgroup>';
  });
  return h;
}

    ${!isHost && online ? '<p class="sub center" style="margin:8px 0 0">모두 준비하면 방장이 시작해요.</p>' : ''}</div>`;
}
function viewPlaying() {
  const r = S.room, m = r.meta, isHost = m.hostId === S.uid;
  return `<h1>게임 시작!</h1>
  <div class="card"><p>카테고리: <span class="badge v">${esc(categoryLabel(m.category))}</span></p>
  <p class="sub">온라인 모드의 게임 화면(질문·답변 턴, 채팅 규칙)은 3단계에서 만들 예정이에요. 지금은 '같은 공간' 모드로 게임을 해볼 수 있어요.</p>
  ${sortedPlayers(r).map(p => `<div class="player">${avatar(p.nickname, p.id)}<b class="grow">${esc(p.nickname)}</b></div>`).join('')}</div>
  ${isHost ? '<button class="btn block" data-act="backToLobby">대기실로 돌아가기</button>' : '<p class="sub center">방장이 대기실로 돌아가길 기다리는 중…</p>'}`;

/* ---- 같은 공간 모드: 게임 화면 ---- */
// 게임에 참가한 전체 명단: 현재 멤버 + 정답 낸 사람 + 중간에 나간 사람
function rosterIds(r) { // 이번 판 참가자 (게임 중간에 들어온 관전자는 제외)
  const g = r.game || {};
  const base = g.players ? Object.keys(g.players) : Object.keys(r.players);
  return [...new Set([...base, ...Object.keys(g.results || {}), ...Object.keys(g.left || {})])];
}
function gamePhase() {
  const r = S.room, g = r && r.game;
  if (!g || !g.startedAt) return { phase: 'wait' };
  if (r.meta.mode === 'online') return (g.ended || aliveIds(r).length <= 1) ? { phase: 'finished' } : { phase: 'playing' };
  const left = g.startedAt + COUNTDOWN_SEC * 1000 - Api.now();
  if (left > 0) return { phase: 'countdown', sec: Math.ceil(left / 1000) };
  const res = g.results || {}, gone = g.left || {}, ids = rosterIds(r);
  if (g.ended || (ids.length > 0 && ids.every(id => res[id] || gone[id] || !r.players[id]))) return { phase: 'finished' };

}
function ranking(r) {
  const res = (r.game && r.game.results) || {};
  const ids = rosterIds(r), total = ids.length;
  const rows = Object.entries(res)
    .map(([id, v]) => ({ id, at: v.at || Api.now(), word: v.word || '' })).sort((a, b) => a.at - b.at)
    .map((d, i) => ({ ...d, rank: i + 1 }));
  const pending = ids.filter(id => !res[id]);
  return { rows, pending, total };
}
function rankLabel(rank, total) {
  if (total >= 2 && rank === total) return '🐢 꼴찌';
  return (['🥇 ', '🥈 ', '🥉 '][rank - 1] || '') + rank + '등';
}
function nameOf(r, id) {
  const g = r.game || {};
  return (r.players[id] && r.players[id].nickname) || ((g.left || {})[id] || {}).nickname || ((g.results || {})[id] || {}).nickname || '?';
}
function viewGame() {
  const r = S.room, m = r.meta, me = S.uid, isHost = m.hostId === me;
  const p = gamePhase();
  if (p.phase === 'wait') return '<div class="empty">게임을 준비하는 중…</div>';
  if (p.phase === 'countdown') {
    return `<div class="rot"><div class="stage cd"><div class="msg">휴대폰을 가로로 돌려서<br>${p.sec}초 안에 이마에 대세요!</div>
      <div class="count">${p.sec}</div><div>화면이 친구들을 향하게 들어 주세요</div></div></div>`;
  }
  const { rows, pending, total } = ranking(r);
  if (p.phase === 'playing') {
    const mine = rows.find(x => x.id === me);
    if (!mine) {
      const w = r.myWord || '…';
      return `<div class="rot"><div class="stage wd"><div class="cat">${esc(categoryLabel(m.category))}</div>
        <div class="word"><span>${esc(w)}</span></div>
        <button class="btn primary block huge" data-act="correct">정답!</button></div>
        <div class="row"><button class="btn small grow" data-act="leaveGame">나가기</button>
        ${isHost ? '<button class="btn small grow" data-act="endGame">게임 그만하기</button>' : ''}</div></div>`;
    }
    return `<div class="card center"><h2>정답! 🎉</h2><div class="rank" style="font-size:34px">${rankLabel(mine.rank, total)}</div>
      <p class="sub">제시어는 <b>${esc(mine.word)}</b>였어요. 다른 멤버를 기다리는 중…</p></div>
      <div class="card"><h2>진행 상황</h2>${rosterIds(r).map(id => {
        const d = rows.find(x => x.id === id);
        return `<div class="player">${avatar(nameOf(r, id), id)}<b class="grow">${esc(nameOf(r, id))}</b>
          ${d ? `<span class="badge m">${d.rank}번째 정답</span>` : ((r.game.left || {})[id] ? '<span class="badge p">나감 (꼴찌)</span>' : '<span class="badge g">맞히는 중…</span>')}</div>`;
      }).join('')}</div>
      <div class="row"><button class="btn small grow" data-act="leaveGame">나가기</button>
      ${isHost ? '<button class="btn small grow" data-act="endGame">게임 그만하기</button>' : ''}</div>`;
  }
  // finished
  return viewResult();
}

function viewResult() {
  const r = S.room, m = r.meta, me = S.uid, isHost = m.hostId === me;
  const { rows, pending, total } = ranking(r);
  const isLast = d => total >= 2 && d.rank === total;
  const podium = rows.filter(d => !isLast(d)).slice(0, 3);
  const roster = rosterIds(r);
  const newcomers = Object.entries(r.players).filter(([id]) => !roster.includes(id)).map(([, pl]) => pl.nickname);
  const newBox = newcomers.length ? `<div class="newmem">👀 새 멤버 ${newcomers.length}명이 들어왔어요!<div>${newcomers.map(esc).join(', ')}</div>
    <div class="sub">${isHost ? '한 판 더를 누르면 새 멤버와 함께 시작하고, 대기실로를 누르면 새 멤버와 함께 대기실로 이동해요.' : '방장이 한 판 더 또는 대기실로를 누르면 함께 시작해요.'}</div></div>` : '';

  const rowHtml = d => `<div class="player ${d.id === me ? 'me' : ''} ${isLast(d) ? 'loser' : ''}"><span class="rank ${isLast(d) ? 'last' : ''}">${rankLabel(d.rank, total)}</span>
      ${avatar(nameOf(r, d.id), d.id)}<div class="grow"><b>${esc(nameOf(r, d.id))}</b>${meBadge(d.id)}
      <div class="sub">제시어: ${esc(d.word)}</div></div></div>`;
  const pendRow = id => `<div class="player ${id === me ? 'me' : ''} loser"><span class="rank last">🐢 꼴찌</span>${avatar(nameOf(r, id), id)}
      <div class="grow"><b>${esc(nameOf(r, id))}</b>${meBadge(id)}
      <div class="sub">${(r.game.left || {})[id] ? '중간에 나갔어요' : (m.mode === 'online' ? '마지막까지 못 맞혔어요' : '끝까지 못 맞혔어요')}${(m.mode === 'online' && id !== me && r.words[id]) ? ' · 제시어: ' + esc(r.words[id]) : ''}</div></div></div>`;
  const mine = rows.find(d => d.id === me);
  const meCard = (mine || pending.includes(me)) ? `<div class="mecard">${avatar(nameOf(r, me), me)}
    <div class="grow"><div class="sub">내 결과</div><div class="mr">${mine ? rankLabel(mine.rank, total) : '🐢 꼴찌'}</div>${mine ? `<div class="sub">제시어: ${esc(mine.word)}</div>` : ''}</div></div>` : '';
  return `<div class="center"><h1 class="title sm">결과 발표!</h1></div>
    ${meCard}

    ${(rows.length || pending.length) ? `<div class="card" style="padding-top:6px;padding-bottom:12px"><h2 style="margin-top:10px">🏆 전체 순위</h2>${rows.map(rowHtml).join('')}${pending.map(pendRow).join('')}</div>` : ''}
    ${newBox}
    ${isHost ? `<div class="row"><button class="btn primary grow huge" data-act="rematch">한 판 더</button>
      <button class="btn grow huge" data-act="backToLobby">대기실로</button></div>`
      : '<p class="sub center">방장이 다음 게임을 정하는 중…</p>'}
    <button class="btn small block" style="margin-top:14px" data-act="leaveGame">나가기</button>`;
}

/* =====================================================================
   이용자 차단 / 신고 (내 기기에만 저장되는 차단 목록 + 운영자에게 전송되는 신고)
   ===================================================================== */
const BLOCK_KEY = 'blockedUsers';
function getBlockList() { try { return JSON.parse(localStorage.getItem(BLOCK_KEY) || '{}'); } catch (e) { return {}; } }
function isBlocked(uid) { return !!getBlockList()[uid]; }
function blockUser(uid, nickname) {
  const list = getBlockList(); list[uid] = { nickname: nickname || '', at: Date.now() };
  localStorage.setItem(BLOCK_KEY, JSON.stringify(list));
}
function unblockUser(uid) { const list = getBlockList(); delete list[uid]; localStorage.setItem(BLOCK_KEY, JSON.stringify(list)); }
const REPORT_REASONS = ['욕설·혐오 표현', '성적인 내용', '스팸·광고', '부적절한 닉네임', '기타'];

/* =====================================================================
   온라인 모드 게임 (방장 폰이 진행 담당 / 방장이 나가면 다음 방장이 이어받음)
   ===================================================================== */
function norm(s) { return String(s || '').normalize('NFC').toLowerCase().replace(/[\s.,·:;!?'"`~\-_\/()\[\]]/g, ''); }
async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const wordHash = (code, uid, text) => sha256hex(code + ':' + uid + ':' + norm(text));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 아직 정답을 못 맞혔고 나가지도 않은 사람들
function aliveIds(r) {
  const g = r.game || {}, res = g.results || {}, gone = g.left || {};
  return rosterIds(r).filter(id => !res[id] && !gone[id] && r.players[id]);
}
// 경고 누적: 내 답변에 눌린 경고 + 시간 초과 경고
function warnCount(r, id) {
  let n = 0;
  for (const m of (r.chat || [])) {
    if (m.kind === 'sys') { if (m.warnTarget === id) n++; }
    else if (m.uid === id) n += Object.keys((r.reports || {})[m.id] || {}).length;
  }
  return n;
}
// 지금 내가 할 수 있는 것 계산 (질문 권한 / 답변 권한 / 대기)
function onlineState(r) {
  const g = r.game, me = S.uid, normal = r.meta.chatMode === 'normal';
  if (!g || !g.startedAt) return { phase: 'wait' };
  const alive = aliveIds(r), meAlive = alive.includes(me), part = rosterIds(r).includes(me);
  if (g.ended || alive.length <= 1) return { phase: 'finished' };
  const chat = r.chat || [];
  if (!normal) return { phase: 'free', role: 'free', part, meAlive, canChat: meAlive, canGuess: meAlive, remaining: null };
  const t = g.turn; if (!t) return { phase: 'wait' };
  const limit = r.meta.chatLimit || 0;
  const remaining = limit ? Math.max(0, Math.ceil((t.at + limit * 1000 - Api.now()) / 1000)) : null;
  const did = id => chat.some(m => m.turn === t.n && m.uid === id && m.kind === 'a') || chat.some(m => m.turn === t.n && m.kind === 'sys' && m.warnTarget === id);
  let role = 'wait', canChat = false, canGuess = false;
  if (t.phase === 'ask') {
    if (t.qid === me && meAlive) { const asked = chat.some(m => (m.kind === 'q' || m.kind === 'guess') && m.turn === t.n && m.uid === me && !m.invalid); role = 'ask'; canChat = !asked; canGuess = !asked; }
  } else if (meAlive && (t.need || []).includes(me) && !did(me)) { role = 'answer'; canChat = true; }
  return { phase: 'normal', t, role, part, canChat, canGuess, qid: t.qid, turnPhase: t.phase, remaining, meAlive };
}

/* ---- 방장 폰이 하는 진행: 질문→답변 단계 전환, 정답 판정, 시간 초과, 다음 차례 ---- */
async function driveOnline() {
  const r = S.room;
  if (!r || !r.meta || r.meta.mode !== 'online' || r.meta.status !== 'playing' || driverId(r) !== S.uid) return;
  const g = r.game; if (!g || !g.startedAt || g.ended || S.driving) return;
  if (S._gid == null || Math.abs(S._gid - g.startedAt) > 2000) { S._gid = g.startedAt; S.judged = {}; S.warned = {}; S.advancedFor = -1; }
  S.driving = true;
  try { await driveStep(r, g); } catch (e) { console.error(e); S.advancedFor = -1; } finally { S.driving = false; }
}
async function driveStep(r, g) {
  const code = r.code, chat = r.chat || [], normal = r.meta.chatMode === 'normal';
  const alive = aliveIds(r);
  if (alive.length <= 1) return;
  const t = g.turn;

  // 1) 정답 시도 판정 (입력한 값의 해시를 저장된 해시와 비교)
  for (const m of chat) {
    if (m.kind !== 'guess' || m.correct !== undefined || m.invalid || S.judged[m.id]) continue;
    S.judged[m.id] = 1;
    const valid = alive.includes(m.uid) && (!normal || (t && t.phase === 'ask' && t.qid === m.uid && m.turn === t.n));
    if (!valid) { await Api.R(`rooms/${code}/chat/${m.id}/invalid`).set(true); return; }
    const ok = (await wordHash(code, m.uid, m.text)) === (r.hashes || {})[m.uid];
    const up = { [`rooms/${code}/chat/${m.id}/correct`]: ok };
    if (ok) up[`rooms/${code}/game/results/${m.uid}`] = { at: Api.TS(), word: String(m.text).trim(), nickname: m.nickname || '' };
    await Api.db.ref().update(up);
    if (normal) { S.advancedFor = t.n; await advanceTurn(r, g, alive.filter(id => !(ok && id === m.uid)), ''); }
    return;
  }
  if (!normal || !t || S.advancedFor === t.n) return;

  const limit = r.meta.chatLimit || 0, elapsed = Api.now() - t.at;
  // 2) 질문자가 나갔거나 이미 정답 처리된 경우
  if (!alive.includes(t.qid)) { S.advancedFor = t.n; return advanceTurn(r, g, alive, ''); }

  const judgedGuess = chat.find(m => m.kind === 'guess' && m.turn === t.n && m.uid === t.qid && m.correct !== undefined && !m.invalid);
  if (judgedGuess) { S.advancedFor = t.n; return advanceTurn(r, g, alive, ''); }

  if (t.phase === 'ask') {
    const q = chat.find(m => m.kind === 'q' && m.turn === t.n && m.uid === t.qid);
    if (q) { // 질문이 올라오면 답변 단계로
      await Api.R(`rooms/${code}/game/turn`).set({ n: t.n, qid: t.qid, phase: 'answer', at: Api.TS(), qMsg: q.id, need: alive.filter(id => id !== t.qid) });
      return;
    }
    if (limit && elapsed > limit * 1000) { S.advancedFor = t.n; return advanceTurn(r, g, alive, `⏰ ${nameOf(r, t.qid)}님이 시간 안에 질문하지 못해 차례가 넘어갔어요`); }
    return;
  }
  // 3) 답변 단계: 모두 답했으면 다음 차례, 시간이 지났으면 미답변자 경고
  const need = (t.need || []).filter(id => alive.includes(id));
  const done = id => chat.some(m => m.turn === t.n && m.uid === id && m.kind === 'a') || chat.some(m => m.turn === t.n && m.kind === 'sys' && m.warnTarget === id);
  const pending = need.filter(id => !done(id));
  if (pending.length === 0) { S.advancedFor = t.n; return advanceTurn(r, g, alive, ''); }
  if (limit && elapsed > limit * 1000) {
    const up = {};
    for (const id of pending) {
      const k = t.n + ':' + id; if (S.warned[k]) continue; S.warned[k] = 1;
      const key = 'w_' + t.n + '_' + id;
      up[`rooms/${code}/chat/${key}`] = { uid: 'sys', nickname: '', kind: 'sys', text: `⏰ ${nameOf(r, id)}님 답변 시간 초과 (경고)`, warnTarget: id, turn: t.n, ts: Api.TS() };
    }
    if (Object.keys(up).length) await Api.db.ref().update(up);
  }
}
async function advanceTurn(r, g, alive, note) {
  const t = g.turn, order = g.order || [];
  if (alive.length <= 1) return;
  const idx = order.indexOf(t.qid); let next = null;
  for (let k = 1; k <= order.length; k++) { const id = order[(idx + k) % order.length]; if (alive.includes(id)) { next = id; break; } }
  if (!next) return;
  const up = { [`rooms/${r.code}/game/turn`]: { n: t.n + 1, qid: next, phase: 'ask', at: Api.TS() } };
  if (note) {
    const key = 'n_' + t.n;
    up[`rooms/${r.code}/chat/${key}`] = { uid: 'sys', nickname: '', kind: 'sys', text: note, turn: t.n, ts: Api.TS() };
  }
  await Api.db.ref().update(up);
}

/* ---- 진행자 선출: 접속 중인 멤버 중 먼저 들어온 사람의 폰이 진행 (방장 폰이 꺼져도 다음 사람이 이어받음) ---- */
const BEAT_EVERY = 10000, BEAT_STALE = 25000, HOST_OFFLINE_GRACE = 15000;
function driverId(r) {
  const now = Api.now();
  const list = Object.entries(r.players || {})
    .filter(([id, p]) => p.online !== false && !(p.beat && now - p.beat > BEAT_STALE))
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  return list.length ? list[0][0] : null;
}
function markActive() { S._act = Date.now(); } // 화면을 만지거나 입력하면 '활동'
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(t => document.addEventListener(t, markActive, { passive: true, capture: true }));

// 방에 접속 중이면 30초마다 '접속 중' 표시, 활동이 있으면 '마지막 활동' 시각을 서버에 남김
function roomPulse() {
  const r = S.room; if (!r || !r.joined || S.leaving || !r.meta) return;
  const now = Api.now(), pub = r.meta.visibility === 'public', up = {};
  if (now - (S._seenAt || 0) >= 30000) {
    S._seenAt = now; up[`rooms/${r.code}/meta/lastSeen`] = Api.TS(); if (pub) up[`publicRooms/${r.code}/lastSeen`] = Api.TS();
  }
  if (S._act && S._act > (S._actSent || 0) && now - (S._actAt || 0) >= 20000) {
    S._actSent = S._act; S._actAt = now; up[`rooms/${r.code}/meta/lastActivity`] = Api.TS(); if (pub) up[`publicRooms/${r.code}/lastActivity`] = Api.TS();
  }
  if (Object.keys(up).length) Api.db.ref().update(up).catch(() => {});
}
// 접속 중이어도 모두 10분간 활동이 없으면 진행자가 방을 닫음 (실제로 지워지는지는 서버 규칙이 시간을 확인해서 결정)
function roomExpiry() {
  const r = S.room; if (!r || !r.joined || !r.meta || S.leaving || !r.meta.lastActivity) return;
  if (driverId(r) !== S.uid) return;
  if (Api.now() - r.meta.lastActivity < ROOM_IDLE_MS || Date.now() - (S._act || 0) < ROOM_IDLE_MS) return;
  if (Date.now() - (S._closing || 0) < 60000) return; S._closing = Date.now();
  Api.deleteRoomIfStale(r.code);
}
// 공개방 목록: 접속자가 없거나 활동이 없는 방은 숨기고, 서버가 허락하면 정리
function publicEntryStale(r) {
  const now = Api.now();
  if (!r.lastSeen) return now - (r.createdAt || now) > PUBLIC_ROOM_TTL; // 예전에 만든 방
  return now - r.lastSeen > ROOM_OFFLINE_MS || now - (r.lastActivity || r.lastSeen) > ROOM_IDLE_MS;
}
function sweepPublic(list) {
  S._swept = S._swept || {}; const now = Date.now();
  (list || []).forEach(r => {
    if (!r.lastSeen || !publicEntryStale(r)) return;
    if (S._swept[r.code] && now - S._swept[r.code] < 120000) return;
    S._swept[r.code] = now; Api.cleanPublicEntry(r.code).catch(() => {});
  });
}
function homeRefresh() { // 메인화면을 켜 두는 동안에도 30초마다 목록을 새로고침
  if (S.screen !== 'home' || Date.now() - (S._homeAt || 0) < 30000) return;
  S._homeAt = Date.now(); sweepPublic(S.publicRooms); render();
}

function heartbeat() { // 10초마다 '나 살아있어요' 표시 (화면이 꺼지거나 멈춘 폰은 진행자에서 빠짐)
  const r = S.room; if (!r || !r.joined || S.leaving) return;
  if (Api.now() - (S._beat || 0) < BEAT_EVERY) return;
  S._beat = Api.now();
  Api.R(`rooms/${r.code}/players/${S.uid}/beat`).set(Api.TS()).catch(() => {});
}
function ensureHost() { // 방장 폰의 연결이 끊긴 채 15초가 지나면, 진행자가 방장 자리를 이어받음
  const r = S.room; if (!r || !r.joined || !r.meta) return;
  const h = r.players[r.meta.hostId];
  if (!h || h.online !== false) { S._hostOffAt = null; return; }
  if (driverId(r) !== S.uid) return;
  if (!S._hostOffAt) { S._hostOffAt = Date.now(); return; }
  if (Date.now() - S._hostOffAt < HOST_OFFLINE_GRACE) return;
  S._hostOffAt = null;
  Api.transferHost(r.code, S.uid, S.nickname, r.meta.visibility === 'public').catch(() => {});
}

/* ---- 다른 멤버의 제시어 구독 (내 것은 서버가 막아 둠) ---- */
function syncWordListeners() {
  const r = S.room; if (!r || !r.meta || r.meta.mode !== 'online') return;
  r._wl = r._wl || {};
  for (const id of Object.keys(r.players)) {
    if (id === S.uid || r._wl[id]) continue;
    const ref = Api.R(`rooms/${r.code}/words/${id}`);
    const fn = ref.on('value', sn => { r.words[id] = sn.val(); if (S.screen === 'room') render(); }, () => {});
    r._wl[id] = () => ref.off('value', fn);
  }
}

/* ---- 화면 배경색(질문 차례 / 답변 차례 / 대기) + 진동, 타이머 글자 ---- */
function maybeConfetti() { // 결과 화면이 처음 나올 때 한 번만 색종이
  const r = S.room;
  if (!r || !r.meta || r.meta.status !== 'playing' || !r.game || !r.game.startedAt || S.screen !== 'room') return;
  if (gamePhase().phase !== 'finished') return;
  if (S._burst && Math.abs(S._burst - r.game.startedAt) < 2000) return;
  S._burst = r.game.startedAt;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#FFD23F', '#FF5C93', '#2DD4A7', '#6A4DFF', '#57B8FF'];
  for (let i = 0; i < 44; i++) {
    const c = document.createElement('span'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px'); c.style.setProperty('--rot', (360 + Math.random() * 720) + 'deg');
    c.style.animationDelay = (Math.random() * 0.6) + 's'; c.style.animationDuration = (2 + Math.random() * 1.4) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4800);
  }
}
function applyRole() {
  const r = S.room; let role = '';
  if (S.screen === 'room' && r && r.meta && r.meta.mode === 'online' && r.meta.status === 'playing') {
    const st = onlineState(r);
    if (st.phase === 'normal' || st.phase === 'free') role = st.meAlive ? st.role : 'watch';
  }
  document.documentElement.dataset.role = role;
  if (role !== S._role) { if ((role === 'ask' || role === 'answer') && navigator.vibrate) navigator.vibrate(200); S._role = role; }
}
function timerInfo(r, st) { // 질문/답변 남은 시간 (막대 + 숫자)
  const label = st.turnPhase === 'ask' ? '질문 시간' : '답변 시간';
  if (st.remaining == null) return { label, text: '제한 없음', pct: 100, low: false };
  const limit = r.meta.chatLimit || 1;
  return { label, text: st.remaining + '초', pct: Math.max(0, Math.min(100, st.remaining / limit * 100)), low: st.remaining <= 10 };
}
function updateTimer() {
  const r = S.room; if (!r || !r.meta) return;
  const el = document.getElementById('tmr'); if (!el) return;
  const st = onlineState(r); if (st.phase !== 'normal') return;
  const ti = timerInfo(r, st);
  el.textContent = ti.text;
  const lb = document.getElementById('tlabel'); if (lb) lb.textContent = '⏱ ' + ti.label;
  const f = document.getElementById('tfill'); if (f) { f.style.width = ti.pct + '%'; f.classList.toggle('low', ti.low); }
}

function gameMsg(r, c) {
  if (c.kind === 'sys') return `<div class="msg sys">${esc(c.text)}</div>`;
  if (isBlocked(c.uid)) return `<div class="msg sys">🚫 차단한 사용자의 메시지예요.</div>`;
  const mine = c.uid === S.uid, rep = (r.reports || {})[c.id] || {}, cnt = Object.keys(rep).length;
  const tag = { q: '❓ 질문', a: '💬 답변', guess: '🎯 정답 시도' }[c.kind] || '';
  let extra = '';
  if (c.kind === 'guess') extra = c.invalid ? ' <span class="badge g">무효</span>' : c.correct === true ? ' <span class="badge m">정답!</span>' : c.correct === false ? ' <span class="badge p">오답</span>' : ' <span class="badge g">확인 중…</span>';
  const canWarn = (c.kind === 'a' || c.kind === 'free') && !mine && rosterIds(r).includes(S.uid);
  const warn = canWarn ? ` <button class="btn small" data-act="report" data-id="${c.id}" ${rep[S.uid] ? 'disabled' : ''}>⚠ 경고${cnt ? ' ' + cnt : ''}</button>` : (cnt ? ` <span class="badge p">⚠ ${cnt}</span>` : '');
  const flag = !mine ? ` <button class="btn small" data-act="openReport" data-uid="${c.uid}" data-name="${esc(c.nickname)}" data-text="${esc(c.text)}">🚩</button>
    <button class="btn small" data-act="toggleBlock" data-uid="${c.uid}" data-name="${esc(c.nickname)}">${isBlocked(c.uid) ? '차단 해제' : '🚫'}</button>` : '';
  return `<div class="msg ${mine ? 'me' : ''}"><b>${esc(c.nickname)}</b> ${tag ? `<span class="badge">${tag}</span>` : ''}${extra}<br><span class="t">${esc(c.text)}</span>${warn}${flag}</div>`;
}

function peekActive(g) { return !!(S.peek && g && g.startedAt && Math.abs(S.peek - g.startedAt) < 3000); }
function viewLiveResult() { // 관전 중에 잠깐 보는 '지금까지의 결과'
  const r = S.room, me = S.uid, { rows, pending, total } = ranking(r);
  const meBadge = id => id === me ? ' <span class="badge l">나</span>' : '';
  const rowHtml = d => `<div class="player"><span class="rank">${rankLabel(d.rank, total)}</span>${avatar(nameOf(r, d.id), d.id)}
    <div class="grow"><b>${esc(nameOf(r, d.id))}</b>${meBadge(d.id)}<div class="sub">제시어: ${esc(d.word)}</div></div></div>`;
  const pendHtml = id => { const out = (r.game.left || {})[id]; return `<div class="player">${avatar(nameOf(r, id), id)}
    <div class="grow"><b>${esc(nameOf(r, id))}</b>${meBadge(id)}<div class="sub">${out ? '중간에 나갔어요' : '아직 맞히는 중…'}${(!out && id !== me && r.words[id]) ? ' · 제시어: ' + esc(r.words[id]) : ''}</div></div>
    ${out ? '<span class="badge p">나감</span>' : '<span class="badge g">진행 중</span>'}</div>`; };
  return `<div class="center"><h1 class="title sm">중간 결과</h1></div>
    <div class="card"><h2>🏁 정답을 맞힌 순서</h2>${rows.length ? rows.map(rowHtml).join('') : '<div class="empty">아직 맞힌 사람이 없어요.</div>'}</div>
    ${pending.length ? `<div class="card"><h2>🤔 아직 맞히는 중</h2>${pending.map(pendHtml).join('')}</div>` : ''}
    <p class="sub center">게임이 끝나면 결과 화면으로 자동으로 이동해요.</p>
    <button class="btn primary block huge" data-act="unpeek">👀 관전으로 돌아가기</button>`;
}

function viewOnline() {
  const r = S.room, m = r.meta, me = S.uid, isHost = m.hostId === me;
  const st = onlineState(r);
  if (st.phase === 'wait') return '<div class="empty">게임을 준비하는 중…</div>';
  if (st.phase === 'finished') return viewResult(); // 관전 중이던 사람도 자동으로 결과 화면
  if (S.guessMode && !st.canGuess) S.guessMode = false;
  const spectating = !st.meAlive; // 정답을 맞힌 사람 + 게임 중간에 들어온 사람
  if (spectating && peekActive(r.game)) return viewLiveResult();
  const normal = m.chatMode === 'normal', g = r.game, res = g.results || {}, gone = g.left || {};
  const { rows, total } = ranking(r);
  const qn = normal ? nameOf(r, st.qid) : '';
  const turnLine = normal ? (st.turnPhase === 'ask' ? `${esc(qn)}님이 질문할 차례` : `${esc(qn)}님의 질문에 멤버들이 답변 중`) : '자유채팅 진행 중';

  let banner;
  if (spectating) banner = st.part ? `🎉 정답! 지금부터 관전 모드예요<br><span class="sub">${turnLine}</span>` : `👀 진행 중인 게임이라 관전만 할 수 있어요<br><span class="sub">${turnLine}</span>`;
  else if (!normal) banner = '💬 자유채팅 — 제한 없이 대화하고, 언제든 정답에 도전하세요';
  else if (st.role === 'ask') banner = st.canChat ? '🙋 내 질문 차례! 내 제시어에 대한 질문 1개를 보내거나, 정답을 시도하세요' : '질문을 보냈어요. 답변을 기다리는 중…';
  else if (st.role === 'answer') banner = `💬 ${esc(qn)}님의 질문에 답변해 주세요 (1회)`;
  else banner = st.turnPhase === 'ask' ? `${esc(qn)}님이 질문할 차례예요` : `${esc(qn)}님의 질문에 멤버들이 답변하는 중…`;

  const ids = rosterIds(r), ordered = ids.includes(me) ? [me, ...ids.filter(id => id !== me)] : ids;
  const specN = Object.keys(r.players).filter(id => !ids.includes(id)).length;
  const cards = ordered.map(id => {
    const isMe = id === me, d = res[id], out = gone[id], row = rows.find(x => x.id === id);
    const word = isMe && !d ? '❓ 비공개' : (d ? d.word : (r.words[id] || '…'));
    const isQ = normal && id === st.qid && !d && !out;
    const stt = d ? rankLabel(row ? row.rank : 0, total) : out ? '나감 (꼴찌)' : (isQ ? '🙋 질문자' : '');
    return `<div class="pc ${isMe ? 'me' : ''} ${isQ && !isMe ? 'q' : ''} ${out ? 'gone' : ''}">${isMe ? '<span class="ribbon">나</span>' : ''}${avatar(nameOf(r, id), id)}
      <div class="nm">${esc(nameOf(r, id))}</div><div class="wd">${esc(word)}</div>
      <div class="wr">⚠ 경고 ${warnCount(r, id)}</div><div class="stt">${stt}</div></div>`;
  }).join('');

  const ti = normal ? timerInfo(r, st) : null;
  const timerBar = ti ? `<div class="timerbar"><span class="tlabel" id="tlabel">⏱ ${ti.label}</span>
      <div class="tbar"><i id="tfill" class="${ti.low ? 'low' : ''}" style="width:${ti.pct}%"></i></div><b class="tnum" id="tmr">${ti.text}</b></div>` : '';
  const canSend = S.guessMode ? st.canGuess : st.canChat;
  const ph = S.guessMode ? '내 제시어를 정확히 입력하세요' : canSend ? (normal ? (st.role === 'ask' ? '질문을 입력하세요 (1회)' : '답변을 입력하세요 (1회)') : '메시지 입력') : '지금은 채팅할 수 없어요';
  const inputArea = spectating
    ? '<p class="sub center" style="margin:12px 0 0">👀 관전 중에는 채팅과 정답 시도를 할 수 없어요.<br>게임이 끝나면 결과 화면으로 자동 이동해요.</p>'
    : `<div class="row" style="margin-top:8px"><input id="gchat" data-model="gchat" maxlength="${CHAT_MAX}" value="${esc(S.form.gchat || '')}"
      placeholder="${ph}" ${canSend ? '' : 'disabled'} autocomplete="off">
      <button class="btn small primary" data-act="sendGame" ${canSend ? '' : 'disabled'}>${S.guessMode ? '정답 제출' : '보내기'}</button></div>
    ${st.canGuess ? `<button class="btn small block ${S.guessMode ? 'lemon' : ''}" style="margin-top:8px" data-act="toggleGuess">🎯 ${S.guessMode ? '정답 시도 취소' : '정답 시도하기'}</button>` : ''}`;
  return `<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div class="row wrap" style="gap:6px"><span class="badge v">${esc(categoryLabel(m.category))}</span>${specN ? `<span class="badge">👀 관전 ${specN}명</span>` : ''}</div>
      <div class="row">${spectating ? '<button class="btn small lemon" data-act="peek">🏆 결과 보기</button>' : ''}<button class="btn small" data-act="leaveGame">나가기</button>
      ${isHost ? '<button class="btn small" data-act="endGame">게임 그만하기</button>' : ''}</div></div>
    <div class="strip">${cards}</div>
    <div class="banner">${banner}</div>
    <div class="chat g" id="chatlog">${(r.chat || []).length ? r.chat.map(c => gameMsg(r, c)).join('') : '<div class="empty">아직 메시지가 없어요.</div>'}</div>
    ${timerBar}
    ${inputArea}`;
}

function viewRoom() {
  if (!S.room || !S.room.meta) return '<div class="empty">방에 들어가는 중…</div>';

function viewReport() {

/* ---- 제시어 글자 크기 자동 맞춤: 칸 안에 딱 들어가는 가장 큰 크기를 찾음 ---- */
function fitWord() {
  const box = document.querySelector('.stage .word'); if (!box) return;
  const t = box.firstElementChild; if (!t) return;
  let lo = 14, hi = Math.max(20, Math.min(280, box.clientHeight));
  const fits = sz => { t.style.fontSize = sz + 'px'; return t.scrollHeight <= box.clientHeight + 1 && t.scrollWidth <= box.clientWidth + 1; };
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (fits(mid)) lo = mid; else hi = mid; }
  t.style.fontSize = lo + 'px';
}
window.addEventListener('resize', fitWord);
window.addEventListener('orientationchange', () => setTimeout(fitWord, 200));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitWord()); // 글꼴이 늦게 로드돼도 제시어 크기를 다시 맞춤

/* ---- 그리기 (입력 중인 칸의 포커스를 유지) ---- */
function render() {
  const a = document.activeElement;
  const keep = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  const log = document.getElementById('chatlog');
  const wasBottom = !log || (log.scrollHeight - log.scrollTop - log.clientHeight < 60);
  const oldTop = log ? log.scrollTop : 0;

  const views = {
    setup: viewSetup, name: viewNickname, home: viewHome, join: viewJoin, create: viewCreate, room: viewRoom,
    boot: () => '<div class="boot"><div class="boot-card">🤔</div><div class="boot-dots"><i></i><i></i><i></i></div></div>'
  };
  const isNewScreen = S.screen !== S._lastScreen; S._lastScreen = S.screen;
  $app.innerHTML = '<div id="viewWrap">' + (views[S.screen] || views.boot)() + '</div>'
    + (S.showQR && S.room ? viewQR() : '') + (S.showHelp && S.screen === 'home' ? viewHelp() : '') + (S.reportTarget ? viewReport() : '');
  if (isNewScreen) { const vw = document.getElementById('viewWrap'); if (vw) vw.classList.add('enter'); }

  const nlog = document.getElementById('chatlog');
  if (nlog) nlog.scrollTop = wasBottom ? nlog.scrollHeight : oldTop;
  fitWord();
  applyRole();
  maybeConfetti();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  if (S.showQR && typeof QRCode !== 'undefined') {
    const box = document.getElementById('qr');
    if (box) new QRCode(box, { text: roomLink(S.room.code), width: 220, height: 220 });
  }
}

/* =====================================================================
   4. 화면 이동 / 방 입장 흐름
   ===================================================================== */
function go(screen) {
  Scanner.close(); S.screen = screen; S.showQR = false; S.showHelp = false;
  if (screen === 'home') { if (!S.unsubPublic) S.unsubPublic = Api.watchPublic(list => { S.publicRooms = list; sweepPublic(list); if (S.screen === 'home') render(); }); }
  else if (S.unsubPublic) { S.unsubPublic(); S.unsubPublic = null; }
  render(); window.scrollTo(0, 0);
}

function enterRoom(code) {
  if (S.unsubRoom) S.unsubRoom();
  S.leaving = false;
  S.room = { code, meta: null, players: {}, muted: {}, kicked: {}, chat: [], game: null, myWord: null, words: {}, hashes: {}, reports: {}, joined: false };
  S.peek = null; S._seenAt = 0; S._actSent = 0; S._actAt = 0; markActive();
  if (Api.lastJoinSpectator) { toast('진행 중인 게임이에요. 관전 모드로 들어왔어요 👀'); Api.lastJoinSpectator = false; }
  localStorage.setItem('lastRoom', code);
  Api.attachPresence(code, S.uid);
  S.unsubRoom = Api.watchRoom(code, S.uid, (key, val) => {
    const r = S.room; if (!r || r.code !== code) return;
    if (key === 'meta') {
      if (val === null && r.meta) {
        const idle = r.meta.lastActivity && Api.now() - r.meta.lastActivity > ROOM_IDLE_MS - 60000;
        toast(idle ? '10분 동안 아무도 활동하지 않아서 방이 닫혔어요.' : '방이 닫혔어요.'); return leaveLocal();
      }
      const prevHost = r.meta && r.meta.hostId;
      r.meta = val;
      if (val && prevHost && prevHost !== val.hostId) {
        if (val.hostId === S.uid) toast('내가 새 방장이 되었어요.'); else if (prevHost === S.uid) toast('방장이 다른 멤버로 바뀌었어요.');
      }
    } else if (key === 'players') {
      r.players = val || {};
      Object.entries(r.players).forEach(([id, pl]) => { if (pl && pl.avatar) S.avCache[id] = pl.avatar; });
      if (r.players[S.uid]) r.joined = true;
      else if (r.joined && !S.leaving) { toast('방장에 의해 강퇴되었어요.'); return leaveLocal(); }
    } else if (key === 'muted') r.muted = val || {};
    else if (key === 'kicked') r.kicked = val || {};
    else if (key === 'chat') r.chat = val || [];
    else if (key === 'game') r.game = val;
    else if (key === 'word') r.myWord = val;
    else if (key === 'wordHashes') r.hashes = val || {};
    else if (key === 'reports') r.reports = val || {};
    if (r.meta) { syncWordListeners(); if (S.screen !== 'room') go('room'); else render(); }
  });
  S.screen = 'room'; render();
}
let wakeLock = null;
async function requestWake() { if (wakeLock || !navigator.wakeLock) return; try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {} }
function releaseWake() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } }
function tick() { // 카운트다운/게임 단계가 바뀌면 화면을 다시 그림
  const r = S.room;
  heartbeat(); ensureHost(); roomPulse(); roomExpiry(); homeRefresh();
  if (r && r.meta && r.meta.mode === 'online' && r.meta.status === 'playing' && S.screen === 'room') { driveOnline(); updateTimer(); return; }
  if (!r || !r.meta || r.meta.mode !== 'same' || r.meta.status !== 'playing' || S.screen !== 'room') { releaseWake(); S._pk = null; return; }
  const p = gamePhase(), key = p.phase + ':' + (p.sec || '');
  if (p.phase === 'countdown' || p.phase === 'playing') requestWake(); else releaseWake();
  try { if (screen.orientation && screen.orientation.lock) { if (p.phase === 'countdown' || p.phase === 'playing') screen.orientation.lock(LANDSCAPE_HOME_SIDE === 'left' ? 'landscape-secondary' : 'landscape-primary').catch(() => {}); else screen.orientation.unlock(); } } catch (e) {}
  if (key !== S._pk) { S._pk = key; render(); }
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S._beat = 0; S._seenAt = 0; } });

function leaveLocal() {
  releaseWake();
  if (S.room && S.room._wl) Object.values(S.room._wl).forEach(f => f());
  if (S.unsubRoom) { S.unsubRoom(); S.unsubRoom = null; }
  Api.detachPresence();
  S.room = null; S.form.chat = '';
  localStorage.removeItem('lastRoom');
  go('home');
}

/* ---- QR 스캔: 카메라를 켜서 친구 방의 QR/링크를 읽음 ---- */
function extractRoomCode(text) {
  text = String(text || '').trim();
  try { const c = new URL(text).searchParams.get('room'); if (c && /^[A-Za-z0-9]{6}$/.test(c)) return c.toUpperCase(); } catch (e) {}
  if (/^[A-Za-z0-9]{6}$/.test(text)) return text.toUpperCase();
  return null;
}
const Scanner = {
  el: null, stream: null, raf: 0, detector: null, busy: false, last: 0,
  async open(onCode) {
    if (this.el) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('이 브라우저에서는 카메라를 쓸 수 없어요. 코드로 입력해 주세요.'); return; }
    const el = document.createElement('div'); el.className = 'scan';
    el.innerHTML = '<video playsinline muted autoplay></video><div class="scan-frame"></div><div class="scan-msg">친구 폰의 QR을 네모 안에 맞춰 주세요</div><button class="btn block" type="button">취소</button>';
    document.body.appendChild(el); this.el = el;
    el.querySelector('button').addEventListener('click', () => this.close());
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      this.close();
      toast(e && e.name === 'NotAllowedError' ? '카메라 권한을 허용해 주세요. (주소창 왼쪽 자물쇠 → 권한)' : '카메라를 켜지 못했어요. 코드로 입력해 주세요.');
      return;
    }
    if (this.el !== el) { stream.getTracks().forEach(t => t.stop()); return; } // 그 사이 취소한 경우
    this.stream = stream;
    const v = el.querySelector('video'); v.srcObject = stream; try { await v.play(); } catch (e) {}
    this.detector = null;
    if ('BarcodeDetector' in window) { try { this.detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { this.detector = null; } }
    const canvas = document.createElement('canvas'), cx = canvas.getContext('2d', { willReadFrequently: true });
    const loop = async () => {
      if (this.el !== el) return;
      const now = Date.now();
      if (v.readyState >= 2 && !this.busy && now - this.last > 120) {
        this.busy = true; this.last = now;
        try {
          let text = null;
          if (this.detector) {
            try { const res = await this.detector.detect(v); if (res.length) text = res[0].rawValue; }
            catch (e) { this.detector = null; } // 이 기기에서 안 되면 아래 방식으로 전환
          } else if (window.jsQR && v.videoWidth) {
            const sc = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
            canvas.width = Math.round(v.videoWidth * sc); canvas.height = Math.round(v.videoHeight * sc);
            cx.drawImage(v, 0, 0, canvas.width, canvas.height);
            const q = jsQR(cx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
            if (q) text = q.data;
          }
          if (text) {
            const code = extractRoomCode(text);
            if (code) { this.close(); onCode(code); return; }
            toast('이 게임의 QR이 아니에요.'); await new Promise(r => setTimeout(r, 1500));
          }
        } catch (e) {}
        this.busy = false;
      }
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  },
  close() {
    cancelAnimationFrame(this.raf);
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    if (this.el) { this.el.remove(); this.el = null; }
    this.busy = false;
  }
};

    render(); const i = document.getElementById('gchat'); if (i) i.focus();

/* ---- 안드로이드 하드웨어 뒤로가기: 화면 안에서 자연스럽게 뒤로 이동, 홈에서 한 번 더 누르면 종료 ---- */
let backPressedOnce = false;
function handleBack() {
  if (S.reportTarget) return Actions.closeReport();
  if (S.showQR) { S.showQR = false; return render(); }
  if (S.showHelp) { S.showHelp = false; return render(); }
  if (document.querySelector('.scan')) return Scanner.close();
  if (S.screen === 'join' || S.screen === 'create') return go('home');
  if (S.screen === 'name' && S.nickname) return go('home'); // 프로필 수정 중 취소
  if (S.screen === 'room' && S.room && S.room.meta && S.room.meta.status === 'playing') return; // 게임 중엔 화면 안의 '나가기' 버튼으로만
  if (S.screen === 'room') return Actions.leave();
  if (S.screen === 'home') {
    const CP = window.Capacitor && window.Capacitor.Plugins;
    if (!CP || !CP.App) return;
    if (backPressedOnce) return CP.App.exitApp();
    backPressedOnce = true; toast('한 번 더 누르면 종료돼요');
    setTimeout(() => { backPressedOnce = false; }, 2000);
  }
}
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  window.Capacitor.Plugins.App.addListener('backButton', handleBack);
}

    S.publicRooms = [
      { code: 'AB12CD', hostName: '하늘', status: 'lobby', playerCount: 3, maxPlayers: 6, category: '연예인', chatMode: 'normal', createdAt: Date.now() },
      { code: 'XY99ZZ', hostName: '민준', status: 'playing', playerCount: 3, maxPlayers: 6, category: '랜덤(전체)', chatMode: 'free', createdAt: Date.now() }
    ];
  } else if (name === 'create') {
    S.screen = 'create';
  } else if (name === 'lobby') {
    S.room = mockRoom({});
    S.screen = 'room';
  } else if (name === 'gameOnline') {
    const r = mockRoom({
      meta: { hostId: 'me', mode: 'online', visibility: 'public', chatMode: 'normal', chatLimit: 0, maxPlayers: 6, category: '연예인', status: 'playing' },
      game: { startedAt: Date.now() - 20000, ended: false, order: ['p2', 'me', 'p3', 'p4'], turn: { n: 1, qid: 'me', phase: 'ask', at: Date.now() }, players: { me: true, p2: true, p3: true, p4: true } }
    });
    S.room = r;
    document.documentElement.dataset.role = 'ask';
    S.screen = 'room';
  } else if (name === 'result') {
    const r = mockRoom({
      meta: { hostId: 'me', mode: 'online', visibility: 'public', chatMode: 'normal', chatLimit: 0, maxPlayers: 6, category: '연예인', status: 'playing' },
      game: {
        startedAt: Date.now() - 90000, ended: true,
        players: { me: true, p2: true, p3: true, p4: true },
        results: {
          p2: { at: Date.now() - 60000, word: '방탄소년단', nickname: '하늘' },
          me: { at: Date.now() - 40000, word: '아이유', nickname: '선호' },
          p3: { at: Date.now() - 10000, word: '블랙핑크', nickname: '민준' }
        }
      }
    });
    S.room = r;
    S.screen = 'room';
  }
  render();
  window.scrollTo(0, 0);
};
window.showScreen('home');
</script>
